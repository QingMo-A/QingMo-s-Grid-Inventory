name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Compile all targets
        run: ./gradlew compileAllTargets

      - name: Build all targets
        run: ./gradlew buildAllTargets

      - name: Upload Forge 1.20.1 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: forge-1.20.1
          path: targets/forge-1.20.1/build/libs/*.jar
          if-no-files-found: error

      - name: Upload NeoForge 1.21.1 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: neoforge-1.21.1
          path: targets/neoforge-1.21.1/build/libs/*.jar
          if-no-files-found: error
