plugins {
    id 'java-library'
}

allprojects {
    version = mod_version
    group = mod_group_id

    repositories {
        mavenLocal()
        mavenCentral()

        maven {
            name = "CurseMaven"
            url = uri("https://cursemaven.com")
            content {
                includeGroup("curse.maven")
            }
        }

        maven {
            name = "NeoForge"
            url = uri("https://maven.neoforged.net/releases")
        }

        maven {
            name = "Curios"
            url = uri("https://maven.theillusivec4.top/")
        }

        maven {
            name = "Forge"
            url = uri("https://maven.minecraftforge.net/")
        }
    }
}

sourceSets {
    main {
        java {
            srcDir "src/main/java"
            include "com/dreamingfish/gridinventory/DFGridInventory.java"
        }
        resources.setSrcDirs([])
    }
}

dependencies {
    compileOnly "org.slf4j:slf4j-api:2.0.9"
}
