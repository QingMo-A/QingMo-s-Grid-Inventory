plugins {
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.141' apply false
    id 'net.minecraftforge.gradle' version '6.0.36' apply false
    id 'org.spongepowered.mixin' version '0.7.38' apply false
}

subprojects {
    version = mod_version
    group = mod_group_id
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

tasks.register("compileAllTargets") {
    group = "build"
    description = "Compiles all supported loader targets."

    dependsOn(
            ":targets:forge-1.20.1:compileJava",
            ":targets:neoforge-1.21.1:compileJava"
    )
}

tasks.register("processAllTargetResources") {
    group = "build"
    description = "Processes resources for all supported loader targets."

    dependsOn(
            ":targets:forge-1.20.1:processResources",
            ":targets:neoforge-1.21.1:processResources"
    )
}

tasks.register("buildAllTargets") {
    group = "build"
    description = "Builds all supported loader targets."

    dependsOn(
            ":targets:forge-1.20.1:build",
            ":targets:neoforge-1.21.1:build"
    )
}

def targetTaskAliases = [
        [
                name       : "Forge1201",
                path       : ":targets:forge-1.20.1",
                description: "Forge 1.20.1"
        ],
        [
                name       : "NeoForge1211",
                path       : ":targets:neoforge-1.21.1",
                description: "NeoForge 1.21.1"
        ]
]

targetTaskAliases.each { target ->
    tasks.register("compile${target.name}") {
        group = "df grid inventory"
        description = "Compile ${target.description} target."
        dependsOn("${target.path}:compileJava")
    }

    tasks.register("process${target.name}Resources") {
        group = "df grid inventory"
        description = "Process resources for ${target.description} target."
        dependsOn("${target.path}:processResources")
    }

    tasks.register("jar${target.name}") {
        group = "df grid inventory"
        description = "Create the development jar for ${target.description} target."
        dependsOn("${target.path}:jar")
    }

    tasks.register("build${target.name}") {
        group = "df grid inventory"
        description = "Build ${target.description} target."
        dependsOn("${target.path}:build")
    }

    tasks.register("run${target.name}Client") {
        group = "df grid inventory"
        description = "Run the ${target.description} client."
        dependsOn("${target.path}:runClient")
    }

    tasks.register("run${target.name}Server") {
        group = "df grid inventory"
        description = "Run the ${target.description} dedicated server."
        dependsOn("${target.path}:runServer")
    }
}
