plugins {
    id 'java-library'
    id 'net.minecraftforge.gradle'
    id 'org.spongepowered.mixin'
}

base {
    archivesName = "${mod_id}-forge-1.20.1"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

repositories {
    mavenCentral()
    maven {
        name = "Sponge"
        url = uri("https://repo.spongepowered.org/repository/maven-public/")
    }
    maven {
        name = "Curios"
        url = uri("https://maven.theillusivec4.top/")
    }
    maven {
        name = "CurseMaven"
        url = uri("https://cursemaven.com")
        content {
            includeGroup("curse.maven")
        }
    }
}

minecraft {
    mappings channel: 'official', version: project.forge_1201_minecraft_version

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            args '--mixin.config=df_grid_inventory.forge1201.mixins.json'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            args '--nogui'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
    }
}

sourceSets {
    main {
        java.setSrcDirs([file("src/main/java"), rootProject.file("common/src/main/java")])
        java.exclude { details ->
            def commonSource = rootProject.file("common/src/main/java").toPath()
            def filePath = details.file.toPath()
            if (!filePath.startsWith(commonSource)) {
                return false
            }
            return details.path == "com/dreamingfish/gridinventory/common/item/SmallGridBagItem.java"
        }
        resources.srcDir rootProject.file("common/src/main/resources")
    }
}

def rarityCoreForge1201 =
        "curse.maven:raritycore-1441762:${raritycore_forge_1201_file_id}"

def enableRarityCoreRuntime =
        (findProperty("raritycore_runtime") ?: "false").toBoolean()

dependencies {
    minecraft "net.minecraftforge:forge:${forge_1201_minecraft_version}-${forge_1201_version}"
    annotationProcessor "org.spongepowered:mixin:0.8.5:processor"
    compileOnly "top.theillusivec4.curios:curios-forge:${forge_1201_curios_version}:api"

    def enableCuriosRuntime = (findProperty("forge_1201_curios_runtime") ?: "true").toBoolean()
    if (enableCuriosRuntime) {
        runtimeOnly fg.deobf("top.theillusivec4.curios:curios-forge:${forge_1201_curios_version}")
    }

    // 只用于开发环境 runClient / runServer。
    if (enableRarityCoreRuntime) {
        runtimeOnly fg.deobf(rarityCoreForge1201)
    }
}

mixin {
    add sourceSets.main, "df_grid_inventory.forge1201.refmap.json"
    config "df_grid_inventory.forge1201.mixins.json"
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version_range: forge_1201_minecraft_version_range,
            loader_version_range   : forge_1201_loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    filesMatching('META-INF/mods.toml') {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'MixinConfigs': 'df_grid_inventory.forge1201.mixins.json'
        ])
    }
}
